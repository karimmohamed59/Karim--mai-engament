<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karim & Mai Engagement</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #f5f1ef, #e9e2de);
    font-family: 'Poppins', sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Envelope container */
.envelope {
    position: relative;
    width: 320px;
    height: 220px;
    cursor: pointer;
}

/* Envelope base */
.base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #f3e8dc;
    border-radius: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
}

/* Flap */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #e6d3c3;
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top;
    transition: 1s ease;
    z-index: 3;
}

/* Wax seal */
.seal {
    position: absolute;
    width: 40px;
    height: 40px;
    background: #a94442;
    border-radius: 50%;
    bottom: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
}

/* Letter */
.letter {
    position: absolute;
    width: 90%;
    height: 180px;
    background: white;
    top: 20px;
    left: 5%;
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);

    transform: translateY(40px);
    opacity: 0;
    transition: 1s ease;
    z-index: 1;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Open animation */
.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(-120px);
    opacity: 1;
}

/* Letter text */
.letter-content {
    text-align: center;
}

.title {
    font-family: 'Great Vibes', cursive;
    font-size: 34px;

    background: linear-gradient(120deg,#b76e79,#e6c7a3,#fff,#e6c7a3,#b76e79);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;

    animation: shimmer 5s infinite;
}

@keyframes shimmer {
    0% { background-position: 200% center; }
    100% { background-position: -200% center; }
}

.subtitle {
    margin-top: 10px;
    font-size: 14px;
    color: #777;
}
</style>
</head>

<body>

<div class="envelope" onclick="openEnvelope()">
    <div class="base"></div>
    <div class="flap"></div>
    <div class="seal"></div>

    <div class="letter">
        <div class="letter-content">
            <div class="title">Karim & Mai</div>
            <div class="subtitle">Engagement Invitation</div>
        </div>
    </div>
</div>

<script>
function openEnvelope() {
    document.querySelector('.envelope').classList.toggle('open');
}
</script>

</body>
</html>
