<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #f4efe9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Envelope container */
.envelope {
    position: relative;
    width: 320px;
    height: 220px;
    cursor: pointer;
}

/* Bottom envelope */
.base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #e9dccf;
    border-radius: 8px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.15);
}

/* Inner triangle */
.inner {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #f7efe6;
    clip-path: polygon(0 100%, 50% 40%, 100% 100%);
    z-index: 2;
}

/* Top flap */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #d8c3ad;
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top;
    transition: 1s ease;
    z-index: 3;
}

/* Wax seal */
.seal {
    position: absolute;
    width: 42px;
    height: 42px;
    background: #9e3b36;
    border-radius: 50%;
    top: 95px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.3);
}

/* Letter */
.letter {
    position: absolute;
    width: 85%;
    height: 160px;
    background: #ffffff;
    top: 40px;
    left: 7.5%;
    border-radius: 6px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.12);

    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;

    transform: translateY(30px);
    transition: 1s ease;
    z-index: 1;
}

/* Opening animation */
.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(-120px);
}

/* Text */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 32px;

    background: linear-gradient(120deg,#b76e79,#e6c7a3,#fff,#e6c7a3,#b76e79);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;

    animation: shimmer 5s infinite;
}

@keyframes shimmer {
    0% { background-position: 200% center; }
    100% { background-position: -200% center; }
}

.subtitle {
    font-size: 13px;
    color: #777;
    margin-top: 8px;
}
</style>
</head>

<body>

<div class="envelope" onclick="openEnvelope()">

    <div class="base"></div>
    <div class="inner"></div>
    <div class="flap"></div>
    <div class="seal"></div>

    <div class="letter">
        <div>
            <div class="title">Karim & Mai</div>
            <div class="subtitle">Engagement Invitation</div>
        </div>
    </div>

</div>

<script>
function openEnvelope() {
    document.querySelector('.envelope').classList.toggle('open');
}
</script>

</body>
</html>
