<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Karim & Mai Engagement</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f3ebee;
    text-align: center;
    overflow-x: hidden;
}

/* Envelope */
.envelope {
    margin-top: 60px;
    position: relative;
    width: 200px;
    height: 130px;
    background: #eee;
    border-radius: 12px;
    margin-left: auto;
    margin-right: auto;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
}

.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #f5a3a3;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    transition: 0.6s;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

.open-text {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    background: #e6e6e6;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 16px;
}

/* Card */
.card {
    display: none;
    margin: 40px auto;
    width: 350px;
    background: #eee;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* Title */
.title {
    font-family: cursive;
    font-size: 28px;
    color: #e91e63;
}

/* Ring */
.ring {
    font-size: 40px;
    margin: 10px 0;
}

/* Info */
.info {
    margin: 10px 0;
    font-size: 16px;
}

/* Countdown */
#countdown {
    margin: 10px 0;
}

/* Button */
.location-btn {
    margin: 15px 0;
    background: #e91e63;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    display: inline-block;
    text-decoration: none;
}

/* Divider */
hr {
    margin: 20px 0;
}

/* RSVP */
button {
    margin: 10px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    background: #e91e63;
    color: white;
}

/* Counters */
.counter {
    position: fixed;
    top: 10px;
    font-weight: bold;
}
#yesCount { left: 15px; }
#noCount { right: 15px; }

/* Hearts */
.heart {
    position: fixed;
    bottom: -10px;
    width: 12px;
    height: 12px;
    background: red;
    transform: rotate(45deg);
    animation: float 6s linear infinite;
}

.heart::before,
.heart::after {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    background: red;
    border-radius: 50%;
}

.heart::before { top: -6px; left: 0; }
.heart::after { left: -6px; top: 0; }

@keyframes float {
    from { transform: translateY(0) rotate(45deg); }
    to { transform: translateY(-100vh) rotate(45deg); }
}
</style>

</head>

<body>

<div id="yesCount" class="counter">0</div>
<div id="noCount" class="counter">0</div>

<div class="envelope" onclick="openEnvelope()">
    <div class="open-text">📩 Open Me</div>
    <div class="flap"></div>
</div>

<div id="card" class="card">

    <div class="title">Karim & Mai Engagement</div>

    <div class="ring">💍</div>

    <div class="info">With joy in our hearts, we invite you to celebrate our engagement!</div>

    <div class="info">📅 <b>April 18, 2026</b></div>
    <div class="info">📍 Cairo, Egypt</div>

    <div id="countdown"></div>

    <a class="location-btn" href="https://maps.google.com" target="_blank">
        View Location
    </a>

    <hr>

    <div><b>Will you join us?</b></div>

    <button onclick="coming()">I’m coming ❤️</button>
    <button onclick="notComing()">Can’t make it 😔</button>

</div>

<script>
let yes = 0;
let no = 0;

function openEnvelope() {
    document.querySelector('.envelope').classList.add('open');
    setTimeout(() => {
        document.getElementById('card').style.display = 'block';
    }, 500);
}

function coming() {
    yes++;
    document.getElementById("yesCount").innerText = yes;
    alert("We’re so happy you’re coming ❤️");
}

function notComing() {
    no++;
    document.getElementById("noCount").innerText = no;
    alert("You’ll be missed 😔");
}

/* Countdown */
const eventDate = new Date("April 18, 2026 00:00:00").getTime();

setInterval(() => {
    const now = new Date().getTime();
    const diff = eventDate - now;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const minutes = Math.floor((diff / (1000*60)) % 60);

    document.getElementById("countdown").innerHTML =
        "⏳ " + days + " days " + hours + " hrs " + minutes + " min";
}, 1000);

/* Hearts */
setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
}, 300);
</script>

</body>
</html>
