<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #f4efe9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container */
.envelope {
    position: relative;
    width: 340px;
    height: 230px;
    cursor: pointer;
    perspective: 1200px;
}

/* Base */
.base {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #e9dccf;
    border-radius: 8px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.2);
}

/* Inner fold */
.inner {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #f7efe6;
    clip-path: polygon(0 100%, 50% 40%, 100% 100%);
    z-index: 2;
}

/* Flap */
.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(180deg, #d8c3ad, #cdb49d);
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top;
    transition: transform 1.2s cubic-bezier(.65,0,.35,1);
    z-index: 4;
    backface-visibility: hidden;
}

/* Wax seal */
.seal {
    position: absolute;
    width: 44px;
    height: 44px;
    background: radial-gradient(circle at 30% 30%, #b94b45, #7a1f1c);
    border-radius: 50%;
    top: 95px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    transition: all 0.6s ease;
}

/* Letter */
.letter {
    position: absolute;
    width: 86%;
    height: 170px;
    background: #ffffff;
    top: 40px;
    left: 7%;
    border-radius: 6px;

    box-shadow: 0 15px 35px rgba(0,0,0,0.15);

    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;

    transform: translateY(35px);
    transition: transform 1.2s cubic-bezier(.65,0,.35,1);
    z-index: 1;
}

/* ✨ OPEN STATE */
.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .seal {
    transform: translateX(-50%) scale(0.7);
    opacity: 0;
}

.envelope.open .letter {
    transform: translateY(-140px);
}

/* TEXT */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 34px;

    background: linear-gradient(120deg,#b76e79,#e6c7a3,#fff,#e6c7a3,#b76e79);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;

    animation: shimmer 5s infinite;
}

.subtitle {
    margin-top: 8px;
    font-size: 13px;
    color: #777;
}

/* shimmer */
@keyframes shimmer {
    0% { background-position: 200% center; }
    100% { background-position: -200% center; }
}
</style>
</head>

<body>

<div class="envelope" onclick="openEnvelope()">

    <div class="base"></div>
    <div class="inner"></div>
    <div class="flap"></div>
    <div class="seal"></div>

    <div class="letter">
        <div>
            <div class="title">Karim & Mai</div>
            <div class="subtitle">Engagement Invitation</div>
        </div>
    </div>

</div>

<script>
function openEnvelope() {
    document.querySelector('.envelope').classList.toggle('open');
}
</script>

</body>
</html>
