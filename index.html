<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karim & Mai Engagement❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #f7f3f2, #ece6e3);
    font-family: 'Poppins', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #444;
    text-align: center;
}

/* Envelope */
.envelope {
    margin-top: 60px;
    width: 90%;
    max-width: 360px;
    height: 220px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-radius: 18px;
    position: relative;
    cursor: pointer;
    box-shadow: 0 25px 80px rgba(183, 110, 121, 0.25);
    transition: 0.4s;
    perspective: 1000px;
}
.envelope:hover { transform: translateY(-5px); }

.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #d6a77a, #c48a6a);
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top;
    transition: 0.8s ease;
}
.envelope.open .flap { transform: rotateX(-180deg); }

.open-text {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 8px 22px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #777;
}

/* Card */
.card {
    display: none;
    margin-top: 40px;
    width: 90%;
    max-width: 400px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(12px);
    padding: 40px 25px;
    border-radius: 22px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.12);
    opacity: 0;
    transform: translateY(30px) scale(0.95);
    transition: 0.8s ease;
}
.card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
}

/* Title */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 40px;
    background: linear-gradient(120deg,#b76e79,#e6c7a3,#fff,#e6c7a3,#b76e79);
    background-size: 200%;
    -webkit-background-clip: text;
    color: transparent;
    animation: shimmer 5s infinite;
}
@keyframes shimmer {
    0% {background-position:200%;}
    100% {background-position:-200%;}
}

.divider { width: 60px; height: 2px; background: #c48a6a; margin: 12px auto; }
.subtitle { letter-spacing: 3px; font-size: 14px; color: #aa8a6b; }
.typing { margin: 8px 0; }

#countdown { margin: 18px 0; }

.location-btn {
    background: linear-gradient(135deg,#b76e79,#c48a6a);
    color: white;
    padding: 10px 26px;
    border-radius: 25px;
    text-decoration: none;
    display: inline-block;
}

button {
    margin: 8px;
    padding: 10px 24px;
    border-radius: 25px;
    border: 1px solid #b76e79;
    background: transparent;
    color: #b76e79;
    cursor: pointer;
}
button:hover { background:#b76e79; color:white; }

.counter {
    position: fixed;
    top: 12px;
    font-size: 13px;
}
#yesCount { left: 15px; }
#noCount { right: 15px; }

/* Popup */
#popup {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    background:white;
    padding:18px 25px;
    border-radius:15px;
}

/* ❤️ FULL ROTATING HEARTS */
.floating-heart {
    position: fixed;
    bottom: 0;
    width: 18px;
    height: 18px;
    transform: rotate(var(--rotate));
    animation: floatUp 4s linear forwards;
    z-index: 999999;
}

.floating-heart::before,
.floating-heart::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    background: inherit;
    border-radius: 50%;
}

.floating-heart::before { top: -9px; left: 0; }
.floating-heart::after { left: 9px; top: 0; }

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(var(--rotate));
        opacity: 1;
    }
    100% {
        transform: translateY(-120vh) rotate(calc(var(--rotate) + 180deg));
        opacity: 0;
    }
}
</style>
</head>

<body>

<div id="yesCount" class="counter">0</div>
<div id="noCount" class="counter">0</div>

<div class="envelope" id="envelope" onclick="openEnvelope()">
    <div class="open-text">Tap to Open</div>
    <div class="flap"></div>
</div>

<div id="card" class="card">
    <div class="title">Karim & Mai</div>
    <div class="divider"></div>
    <div class="subtitle">ENGAGEMENT💍</div>

    <div id="line1" class="typing"></div>
    <div id="line2" class="typing"></div>
    <div id="line3" class="typing"></div>
    <div id="line4" class="typing"></div>
    <div id="line5" class="typing"></div>
    <div id="countdown"></div>

    <a class="location-btn" href="https://maps.app.goo.gl/DCoZfnU6cCvsSjgy9" target="_blank">
        View Location
    </a>

    <hr>

    <div><b>Will you join us?</b></div>
    <button onclick="coming()">I am coming❤️</button>
    <button onclick="notComing()">Can't make it😔</button>
</div>

<div id="popup"><span id="popupText"></span></div>

<script>
let yes=0,no=0,typed=false;

const heartColors=['#b76e79','#e6c7a3','#c48a6a','#f2d6c1','#d4a5a5'];

function openEnvelope(){
    document.getElementById('envelope').classList.add('open');
    setTimeout(()=>{
        let card=document.getElementById('card');
        card.style.display='block';
        setTimeout(()=>card.classList.add('show'),50);
        if(!typed){startTyping();typed=true;}
    },700);
}

function typeLine(id,text,delay){
    let i=0;
    setTimeout(()=>{
        let interval=setInterval(()=>{
            document.getElementById(id).innerHTML+=text.charAt(i);
            i++;
            if(i>=text.length)clearInterval(interval);
        },35);
    },delay);
}

function startTyping(){
    typeLine("line1","With joy in our hearts,",0);
    typeLine("line2","we invite you to celebrate our engagement 💖",1500);
    typeLine("line3","📅 April 18, 2026",3500);
    typeLine("line4","📍 Cairo, Egypt, Galaa club, the view venue",5000);
    typeLine("line5","5 pm to 9 pm",3500);
}

/* ❤️ HEARTS */
function createFloatingHeart(){
    const heart=document.createElement('div');
    heart.className='floating-heart';

    heart.style.left=Math.random()*window.innerWidth+'px';
    heart.style.backgroundColor=heartColors[Math.floor(Math.random()*heartColors.length)];

    // FULL rotation
    const rotation=Math.random()*360;
    heart.style.setProperty('--rotate', rotation+'deg');

    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),4000);
}

function coming(){
    yes++;
    document.getElementById("yesCount").innerText=yes;

    showPopup("We’re so excited to see you ❤️");

    let interval=setInterval(createFloatingHeart,100);
    setTimeout(()=>clearInterval(interval),2500);
}

function notComing(){
    no++;
    document.getElementById("noCount").innerText=no;
    showPopup("You’ll be missed 😔");
}

function showPopup(msg){
    let p=document.getElementById("popup");
    document.getElementById("popupText").innerText=msg;
    p.style.display="block";
    setTimeout(()=>p.style.display="none",2500);
}

/* Countdown */
const eventDate=new Date("April 18, 2026").getTime();

setInterval(()=>{
    let now=new Date().getTime();
    let diff=eventDate-now;

    let d=Math.floor(diff/(1000*60*60*24));
    let h=Math.floor((diff/(1000*60*60))%24);
    let m=Math.floor((diff/(1000*60))%60);

    document.getElementById("countdown").innerHTML=
        d+" days • "+h+" hrs • "+m+" min";
},1000);
</script>

</body>
</html>
