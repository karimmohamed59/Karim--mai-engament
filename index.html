<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Karim & Mai Engagement</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    background: linear-gradient(135deg, #f8f5f4, #efe7e4);
    font-family: 'Poppins', sans-serif;

    display: flex;
    flex-direction: column;
    align-items: center;

    min-height: 100vh;
    color: #444;
}

/* Envelope */
.envelope {
    margin-top: 90px;
    width: 90%;
    max-width: 360px;
    height: 220px;
    background: #ffffff;
    border-radius: 16px;
    position: relative;
    cursor: pointer;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}

.flap {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #d8b4a0;
    clip-path: polygon(0 0, 100% 0, 50% 65%);
    transform-origin: top;
    transition: 0.8s ease;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* Open text */
.open-text {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
    background: #ffffff;
    padding: 8px 22px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #888;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

/* Card */
.card {
    display: none;
    margin-top: 50px;
    width: 90%;
    max-width: 380px;
    background: #ffffff;
    padding: 35px 25px;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.12);
}

/* Title */
.title {
    font-family: 'Great Vibes', cursive;
    font-size: 38px;
    color: #b76e79;
    margin-bottom: 5px;
}

/* Divider line */
.divider {
    width: 50px;
    height: 2px;
    background: #d8b4a0;
    margin: 10px auto 20px;
}

/* Ring */
.ring {
    font-size: 30px;
    margin-bottom: 10px;
}

/* Text */
.typing {
    min-height: 22px;
    margin: 6px 0;
    font-size: 15px;
    color: #555;
}

/* Countdown */
#countdown {
    margin: 15px 0;
    font-size: 14px;
    color: #777;
}

/* Button */
.location-btn {
    margin: 15px 0;
    background: #b76e79;
    color: white;
    padding: 10px 24px;
    border-radius: 25px;
    text-decoration: none;
    font-size: 14px;
}

/* Divider */
hr {
    margin: 25px 0;
    border: none;
    border-top: 1px solid #eee;
}

/* RSVP */
button {
    margin: 8px;
    padding: 10px 22px;
    border-radius: 25px;
    border: 1px solid #b76e79;
    background: transparent;
    color: #b76e79;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #b76e79;
    color: white;
}

/* Counters */
.counter {
    position: fixed;
    top: 12px;
    font-size: 13px;
    color: #777;
}
#yesCount { left: 15px; }
#noCount { right: 15px; }

/* Popup */
#popup {
    display:none;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:white;
    padding:18px 25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    font-size:16px;
}

/* Desktop zoom */
@media (min-width: 1024px) {
    body { zoom: 1.15; }
}
</style>
</head>

<body>

<div id="yesCount" class="counter">0</div>
<div id="noCount" class="counter">0</div>

<div class="envelope" onclick="openEnvelope()">
    <div class="open-text">Tap to Open</div>
    <div class="flap"></div>
</div>

<div id="card" class="card">

    <div class="title">Karim & Mai</div>
    <div class="divider"></div>

    <div class="ring">Engagement</div>

    <div id="line1" class="typing"></div>
    <div id="line2" class="typing"></div>
    <div id="line3" class="typing"></div>
    <div id="line4" class="typing"></div>

    <div id="countdown"></div>

    <a class="location-btn" href="https://maps.app.goo.gl/DCoZfnU6cCvsSjgy9" target="_blank">
        View Location
    </a>

    <hr>

    <div><b>Will you join us?</b></div>

    <button onclick="coming()">Accept</button>
    <button onclick="notComing()">Decline</button>

</div>

<div id="popup"><span id="popupText"></span></div>

<script>
let yes = 0;
let no = 0;
let typed = false;

function openEnvelope() {
    document.querySelector('.envelope').classList.add('open');
    setTimeout(() => {
        document.getElementById('card').style.display = 'block';
        if (!typed) {
            startTyping();
            typed = true;
        }
    }, 700);
}

function typeLine(id, text, delay) {
    let i = 0;
    setTimeout(() => {
        let interval = setInterval(() => {
            document.getElementById(id).innerHTML += text.charAt(i);
            i++;
            if (i >= text.length) clearInterval(interval);
        }, 35);
    }, delay);
}

function startTyping() {
    typeLine("line1", "With joy in our hearts,", 0);
    typeLine("line2", "we invite you to celebrate our engagement", 1500);
    typeLine("line3", "April 18, 2026", 3500);
    typeLine("line4", "Cairo, Egypt – Galaa Club, The View Venue", 5000);
}

function coming() {
    yes++;
    document.getElementById("yesCount").innerText = yes;
    showPopup("We look forward to celebrating with you");
}

function notComing() {
    no++;
    document.getElementById("noCount").innerText = no;
    showPopup("You will be missed");
}

function showPopup(message) {
    const popup = document.getElementById("popup");
    document.getElementById("popupText").innerText = message;
    popup.style.display = "block";
    setTimeout(() => popup.style.display = "none", 2500);
}

const eventDate = new Date("April 18, 2026 00:00:00").getTime();

setInterval(() => {
    const now = new Date().getTime();
    const diff = eventDate - now;

    const d = Math.floor(diff / (1000*60*60*24));
    const h = Math.floor((diff / (1000*60*60)) % 24);
    const m = Math.floor((diff / (1000*60)) % 60);

    document.getElementById("countdown").innerHTML =
        d + " days • " + h + " hrs • " + m + " min";
}, 1000);
</script>

</body>
</html>
